      <stop offset="0" stop-color="#bfe3ff"/><stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#sky)"/>
  <circle cx="415" cy="52" r="30" fill="#ffd94d"/>
  <rect y="200" width="480" height="100" fill="#8fd06f"/>
  <!-- barn -->
  <rect x="30" y="120" width="120" height="90" fill="#d94f4f"/>
