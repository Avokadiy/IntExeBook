    <rect x="12" y="58" width="8" height="30" fill="#7a5230"/>
    <rect x="34" y="60" width="8" height="30" fill="#7a5230"/>
    <rect x="58" y="60" width="8" height="30" fill="#7a5230"/>
    <rect x="74" y="58" width="8" height="30" fill="#7a5230"/>
    <path d="M80 30 Q104 18 108 -4 L120 -2 Q118 24 88 42 Z" fill="#9c6b3f"/>
